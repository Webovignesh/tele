name: Apply selection persistence cleanup

on:
  push:
    branches:
      - rescue/legacy-modernization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[selection-persistence-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue/legacy-modernization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cleanup patch
        run: python scripts/apply-selection-persistence.py
      - name: Syntax checks
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/rescue-runtime.js
      - name: Install and verify
        run: |
          npm ci
          npm run verify
      - name: Guard removed actions
        shell: bash
        run: |
          ! grep -R "save-unique\|idl-links\|save-selected-preview\|save-selected-links\|save-selected-direct\|downloadViaIDM\|saveUniqueSelected" public server.js
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/app.js public/index.html public/rescue-runtime.js public/rescue-runtime.css
          git commit -m "fix(rescue): persist chat state and simplify selection dock [selection-persistence-bot]"
          git push origin HEAD:rescue/legacy-modernization
