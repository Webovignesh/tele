name: Apply one-shot files rescue

on:
  push:
    branches:
      - rescue/legacy-modernization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[one-shot-files-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue/legacy-modernization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply one-shot files patch
        run: python scripts/apply-one-shot-files.py
      - name: Syntax checks
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/rescue-runtime.js
      - name: Install and verify
        run: |
          npm ci
          npm run verify
      - name: Commit rescue changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/rescue-runtime.js
          git commit -m "fix(rescue): persist tabs and load complete file snapshots [one-shot-files-bot]"
          git push origin HEAD:rescue/legacy-modernization
