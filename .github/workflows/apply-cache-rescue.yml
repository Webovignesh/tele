name: Apply cache rescue

on:
  push:
    branches:
      - rescue/legacy-modernization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[cache-rescue-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue/legacy-modernization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cache rescue patch
        run: python scripts/apply-cache-rescue.py
      - name: Syntax checks
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/rescue-runtime.js
      - name: Install and verify
        run: |
          npm ci
          npm run verify
      - name: Commit rescue changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/index.html
          git commit -m "fix(rescue): cache chat browsing and lazy-load media [cache-rescue-bot]"
          git push origin HEAD:rescue/legacy-modernization
