name: Apply message order and dock fix

on:
  push:
    branches:
      - rescue/legacy-modernization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[message-dock-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue/legacy-modernization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/apply-message-order-dock.py
      - name: Syntax checks
        run: |
          node --check public/app.js
          node --check public/rescue-runtime.js
      - name: Install and verify
        run: |
          npm ci
          npm run verify
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/rescue-runtime.js public/rescue-runtime.css
          git commit -m "fix(rescue): correct message order and dock actions [message-dock-bot]"
          git push origin HEAD:rescue/legacy-modernization
