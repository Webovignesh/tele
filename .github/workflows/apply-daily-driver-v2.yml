name: Apply daily-driver v2 hotfix

on:
  push:
    branches:
      - rescue/legacy-modernization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[daily-driver-v2-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue/legacy-modernization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair staged patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-daily-driver-v2.js')
          s = p.read_text()
          replacements = {
              "throw new Error(`Telegram attachment send failed. Direct: ${first}. Prepared upload: ${second}`)": "throw new Error('Telegram attachment send failed. Direct: ' + first + '. Prepared upload: ' + second)",
              "res.setHeader('Content-Disposition', `inline; filename*=UTF-8''${encodeURIComponent(name)}`)": "res.setHeader('Content-Disposition', \"inline; filename*=UTF-8''\" + encodeURIComponent(name))",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected staged template not found: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          node --check scripts/apply-daily-driver-v2.js
      - name: Apply source patch
        run: node scripts/apply-daily-driver-v2.js
      - name: Normalize runtime binding and smoke invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('public/telegram-daily-driver.js')
          js = runtime.read_text()
          binding = "\nconst teleDailySendButton = document.querySelector('#tele-compose-send')\nif (teleDailySendButton) teleDailySendButton.onclick = rescueSendComposer\n"
          if 'const teleDailySendButton =' not in js:
              js += binding
          runtime.write_text(js)

          smoke = Path('scripts/rescue-smoke.test.cjs')
          text = smoke.read_text()
          obsolete = "assert.doesNotMatch(server, /preliminaryUploadFile/, 'ordinary attachments must not use preliminary upload handoff')"
          replacement = "assert.match(server, /managedPrepareInputFile/, 'attachments must have a prepared-upload fallback when direct local input fails')"
          if obsolete in text:
              text = text.replace(obsolete, replacement)
          smoke.write_text(text)
          PY
          node --check public/telegram-daily-driver.js
      - name: Install and verify
        run: |
          npm ci
          node --check server.js
          node --check public/app.js
          node --check public/rescue-runtime.js
          node --check public/management.js
          node --check public/telegram-daily-driver.js
          npm run verify
      - name: Guard daily-driver v2 behavior
        shell: bash
        run: |
          grep -q "batchItems" server.js
          grep -q "managedPrepareInputFile" server.js
          grep -q "Accept-Ranges" server.js
          grep -q "teleDailyFilesItems" public/telegram-daily-driver.js
          grep -q "teleDailyMergeScanBatch" public/telegram-daily-driver.js
          grep -q "hour12: true" public/telegram-daily-driver.js
          grep -q "teleDailySendButton" public/telegram-daily-driver.js
          grep -q "telegram-daily-driver.js" public/index.html
          grep -q "telegram-daily-driver.css" public/index.html
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/index.html public/telegram-daily-driver.js public/telegram-daily-driver.css scripts/rescue-smoke.test.cjs
          git commit -m "fix(rescue): stabilize files, media, composer, and chat UI [daily-driver-v2-bot]"
          git push origin HEAD:rescue/legacy-modernization
