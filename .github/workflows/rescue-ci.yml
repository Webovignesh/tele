name: Rescue CI

on:
  push:
    branches:
      - rescue/legacy-modernization
  pull_request:
    branches:
      - rescue/legacy-modernization

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/rescue-runtime.js
      - run: npm run verify
      - name: Rescue runtime wiring
        shell: bash
        run: |
          grep -q 'rescue-runtime.js' public/index.html
          grep -q 'rescue-runtime.css' public/index.html
          grep -q 'photoFileId' server.js
