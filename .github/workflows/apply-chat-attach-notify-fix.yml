name: Apply chat attach notification fix

on:
  push:
    branches:
      - rescue/legacy-modernization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[chat-attach-notify-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue/legacy-modernization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair staged patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/apply-chat-attach-notify-fix.py')
          s = p.read_text()
          # Repair two accidentally literal newlines inside Python string literals.
          s = s.replace(")),\n\",\n", ")),\\n\",\n")
          # This composer-visibility hook is already present in the current rescue runtime.
          s = re.sub(
              r"\nreplace_once\(\n    'public/rescue-runtime\.js',\n    \"  rescueBaseSetView\(view\)\\n  if \(view === 'files' && state\.activeChatId != null\) \{\",.*?    'sync composer visibility'\n\)\n",
              "\n",
              s,
              count=1,
              flags=re.S,
          )
          # Match the whole existing composer template, including nested divs.
          s = s.replace(
              r'r"  composer\\.innerHTML = `\\n    <div id=\\\"tele-compose-context\\\".*?</div>`\\n  chat\\.insertBefore\\(composer, foot\\)"',
              r'r"  composer\\.innerHTML = `.*?`\\n  chat\\.insertBefore\\(composer, foot\\)"',
          )
          p.write_text(s)
          PY
          python -m py_compile scripts/apply-chat-attach-notify-fix.py
      - name: Apply patch
        run: python scripts/apply-chat-attach-notify-fix.py
      - name: Install and verify
        run: |
          npm ci
          node --check server.js
          node --check public/app.js
          node --check public/rescue-runtime.js
          node --check public/management.js
          node --check public/sw.js
          npm run verify
      - name: Guard create chat attach notification wiring
        shell: bash
        run: |
          grep -q "if (next) next.disabled = false" public/management.js
          grep -q "replace-managed-invite" server.js
          grep -q "replacePrimaryChatInviteLink" server.js
          grep -q "api/chat-attachment" server.js
          grep -q "inputMessageDocument" server.js
          grep -q "tele-compose-attach" public/rescue-runtime.js
          grep -q "rescueTestDesktopNotification" public/rescue-runtime.js
          grep -q "notificationclick" public/sw.js
          ! grep -q "check-managed-username" public/management.js
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/rescue-runtime.js public/management.js public/management.css public/index.html public/sw.js scripts/rescue-smoke.test.cjs
          git commit -m "feat(rescue): fix creation, add attachments, and repair notifications [chat-attach-notify-bot]"
          git push origin HEAD:rescue/legacy-modernization
