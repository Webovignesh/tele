name: Apply chat service and realtime polish

on:
  push:
    branches:
      - rescue/legacy-modernization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[chat-service-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue/legacy-modernization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/apply-chat-service-polish.py
      - name: Install and verify
        run: |
          npm ci
          npm run verify
      - name: Guard chat service wiring
        shell: bash
        run: |
          grep -q "case 'send-chat-message'" server.js
          grep -q "case 'delete-chat-message'" server.js
          grep -q "managedSupergroupFullInfoCache" server.js
          grep -q "tele-composer" public/rescue-runtime.js
          grep -q "Desktop notifications" public/management.js
          grep -q "Clear history for everyone" public/management.js
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/app.js public/rescue-runtime.js public/management.js public/management.css public/index.html scripts/rescue-smoke.test.cjs
          git commit -m "feat(rescue): add chat service, notifications, and realtime info sync [chat-service-bot]"
          git push origin HEAD:rescue/legacy-modernization
